{{ define "main" }}
<header class="hero">
  <h1>{{ site.Title }}</h1>
  {{ with site.Params.issn }}<p>ISSN {{ . }} (Online)</p>{{ end }}
</header>
<div class="year-list">
{{ range sort site.Data.years "year" "desc" }}
  <article><h2><a href="{{ printf "%s/" .year | relURL }}">{{ .title }}</a></h2><p>{{ .disclosure }}</p></article>
{{ end }}
</div>
{{ end }}
